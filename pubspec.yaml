name: planstar_desktop_app
description: "企划星 · 桌面日历清单 —— 基于 Clean DDD + Riverpod 的 Flutter 桌面端重写版。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Pub Workspace：packages/infras 下的两个包由根工程统一解析，禁止各自 pub get。
workspace:
  - packages/desktop_multi_window
  - packages/infras/core
  - packages/infras/core_design_system

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── 图标：全项目统一使用 Lucide（lucide_icons_flutter）────────────────────
  # 4.0.3 对应 Lucide 官方图标集，SDK 约束 ^3.0.0，兼容当前 Dart 3.11.5。
  lucide_icons_flutter: 4.0.3

  # ── 已有基建包：零 Flutter 内核 + 三层设计令牌 ────────────────────────────
  core:
    path: packages/infras/core
  core_design_system:
    path: packages/infras/core_design_system

  # ── 状态管理 / 路由 ──────────────────────────────────────────────────────
  # 3.4+ 要求 Dart 3.12，当前 SDK 为 3.11.5，故精确锁定 3.3.2。
  flutter_riverpod: 3.3.2
  riverpod: 3.3.2
  go_router: ^17.5.0

  # ── 桌面端关键能力 ───────────────────────────────────────────────────────
  window_manager: ^0.5.2
  desktop_multi_window:
    path: packages/desktop_multi_window
  tray_manager: ^0.5.3
  launch_at_startup: ^0.5.1
  # 屏幕/显示器信息与全局热键。
  # hotkey_manager 0.4.x 要求 Dart 3.14 / Flutter 3.50，当前 SDK 3.11.5
  # 只能用 0.2.x；screen_retriever 已是 window_manager 的传递依赖，这里
  # 显式声明以便直接 import 使用，并固定到 0.2.x（0.4.x 同样不兼容）。
  screen_retriever: ^0.2.2
  hotkey_manager: ^0.2.3
  path_provider: ^2.1.6
  # 13.x 的 windows_file_picker 依赖 win32 6，与 launch_at_startup 的
  # win32_registry 2.x（win32 5）互斥；11.0.3 使用 win32 5，可共存。
  file_picker: ^11.0.3

  # ── 提醒 / 通知 / 音效 ───────────────────────────────────────────────────
  # 23.x 要求 Flutter 3.44；22.3.3 是当前 SDK 下最新的 Windows 可用版本。
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  # 6.8+ 要求 Flutter 3.44，故锁定 6.7.1。
  audioplayers: 6.7.1

  # ── core 存储端口的平台适配器 ────────────────────────────────────────────
  shared_preferences: ^2.5.6
  # 11.x 的 windows 实现要求 win32 6；10.3.4 走 win32 5，与桌面插件组兼容。
  flutter_secure_storage: ^10.3.4

  # ── 领域工具 ────────────────────────────────────────────────────────────
  intl: 0.20.2
  lunar: ^1.7.9
  auto_updater: ^1.0.0
  flutter_app_packager: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dio: ^5.11.1
  # 官方跨端通信代码生成器：类型安全的 HostApi / FlutterApi，
  # 取代手写 MethodChannel/EventChannel 的字符串方法与动态 Map。
  # 27.x 起依赖 analyzer >=10（要求 meta 1.18，与当前 Flutter SDK 固定的
  # meta 1.17 冲突），故锁定 26.1.2：最后一个兼容 Dart 3.11.5 的稳定版。
  pigeon: 26.1.2

flutter:
  generate: true
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/config/
    - assets/audio/
    # 仅托盘图标需要随包发布；其余 512/1024 图标只用于生成安装包资源，
    # 打进 flutter_assets 会白白增加约 3 MB 体积。
    - assets/app_icons/tray_icon.ico
    - assets/app_icons/planstar_icon_1024_transparent.png
  # 全局字体：ChillRoundGothic（圆润无衬线，Regular 400 / Medium 500）
  # 由 core_design_system 的 AppTypography.fontFamily 统一引用。
  fonts:
    - family: ChillRoundGothic
      fonts:
        - asset: assets/fonts/ChillRoundGothic_Regular.ttf
          weight: 400
        - asset: assets/fonts/ChillRoundGothic_Medium.ttf
          weight: 500
